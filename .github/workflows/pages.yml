# Publishes the Vite app to GitHub Pages.
# Settings → Pages → Source must be GitHub Actions before the first deploy can succeed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time. Let the in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Lint, tests, the smoke play and the build must pass before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # build:pages passes --base=/tech-ascension/ so JS and CSS resolve on the project site.
        run: npm run build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
