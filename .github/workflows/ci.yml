# Lint, unit tests, the smoke play and the build. Runs on every pull request, and the Pages deploy
# calls it before publishing, so main is checked by the deploy run instead of a second copy here.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. A deploy's check is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Smoke play
        run: npm run smoke:play

      - name: Build
        run: npm run build
